<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>

html,body{margin:0}
body{width:1200px;height:1600px;overflow:hidden;font-family:KL,K,sans-serif;color:#eef0ff;
 background:radial-gradient(1200px 900px at 85% 10%,#2b3a8f 0%,transparent 60%),radial-gradient(900px 700px at 0% 100%,#3a1f6e 0%,transparent 60%),#0f1638;position:relative}
.graph{position:absolute;left:0;top:0}
.wrap{position:absolute;left:96px;right:96px;bottom:120px}
.kicker{font:500 26px M,monospace;color:#ffc857;letter-spacing:.5px;margin-bottom:34px}
.kicker span{color:#8fa0e8}
h1{margin:0;font-weight:900;font-size:168px;line-height:1.02;letter-spacing:-6px}
h1 em{font-style:normal;color:#ffc857}
.sub{margin-top:40px;font-weight:400;font-size:38px;line-height:1.5;color:#c9cff5;letter-spacing:-.5px}
.tags{margin-top:56px;display:flex;flex-wrap:wrap;gap:14px}
.tags b{font-weight:700;font-size:26px;padding:10px 24px;border:2px solid rgba(255,255,255,.28);border-radius:999px;color:#e4e8ff}
.foot{margin-top:84px;padding-top:30px;border-top:2px solid rgba(255,255,255,.18);display:flex;justify-content:space-between;font-size:26px;color:#9aa5d8}
.foot strong{color:#eef0ff;font-weight:700}
</style></head><body>

 </g>

<div class="wrap">
