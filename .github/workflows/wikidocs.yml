name: Publish to WikiDocs

# 위키독스 API 토큰은 저장소 Settings → Secrets and variables → Actions 에 WIKIDOCS_TOKEN 으로 저장한다.
# 처음 실행하면 새 책을 만들고, 책·페이지 ID를 wikidocs/.wikidocs-state.json 에 커밋해 두어
# 이후 실행에서는 같은 책을 갱신한다.
on:
  workflow_dispatch:
    inputs:
      open:
        description: "새 책을 공개로 만들기 (처음 실행할 때만 적용)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [wikidocs/**]

permissions:
  contents: write

concurrency:
  group: wikidocs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Upload to WikiDocs
        env:
          WIKIDOCS_TOKEN: ${{ secrets.WIKIDOCS_TOKEN }}
        run: |
          if [ -z "$WIKIDOCS_TOKEN" ]; then
            echo "::notice::WIKIDOCS_TOKEN 시크릿이 없어 업로드를 건너뜁니다. 자동 업로드를 쓰려면 Settings → Secrets and variables → Actions 에 추가하세요."
            exit 0
          fi
          python tools/publish_wikidocs.py --src wikidocs ${{ inputs.open && '--open' || '' }}
      - name: Save book state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wikidocs/.wikidocs-state.json
          git diff --cached --quiet || git commit -m "chore: 위키독스 책·페이지 ID 기록 [skip ci]"
          git push
